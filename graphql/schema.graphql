scalar Long

schema {
  query: Query
  mutation: Mutation
}

#Root node
type Query {
  version: String
}

type Mutation {
  version: String
}

# String key, String value pair.
type KeyValue {
  key: String!
  value: String
}

# String key, Long/Int value pair.
type KeyNumericValue {
  key: String!
  value: Long!
}

# The Duration defines the start and end time for each query operation.
# Fields: `start` and `end`
#   represents the time span. And each of them matches the step.
#   ref https://www.ietf.org/rfc/rfc3339.txt
#   The time formats are
#       `SECOND` step: yyyy-MM-dd HHmmss
#       `MINUTE` step: yyyy-MM-dd HHmm
#       `HOUR` step: yyyy-MM-dd HH
#       `DAY` step: yyyy-MM-dd
#       `MONTH` step: yyyy-MM
# Field: `step`
#   represents the accurate time point.
# e.g.
#   if step==HOUR , start=2017-11-08 09, end=2017-11-08 19
#   then
#       metrics from the following time points expected
#       2017-11-08 9:00 -> 2017-11-08 19:00
#       there are 11 time points (hours) in the time span.
input Duration {
  start: String!
  end: String!
  step: Step!
  # Only for BanyanDB, the flag to query from cold stage, default is false.
  coldStage: Boolean
}

enum Step {
  DAY
  HOUR
  MINUTE
  SECOND
}

enum Order {
  ASC
  DES
}

input Pagination {
  # pageNum starts in 1, the default is 1.
  pageNum: Int
  pageSize: Int!
  # total is not provided since 9.1.0
  # The client side determines the existing of the next page, which should be TRUE when `size of response list` == `pageSize'
}

enum Language {
  # For not language based agent, the language is impossible to tell.
  UNKNOWN
  JAVA
  DOTNET
  NODEJS
  PYTHON
  RUBY
  GO
  LUA
  PHP
}

enum Scope {
  All
  Service
  ServiceInstance
  Endpoint
  Process
  ServiceRelation
  ServiceInstanceRelation
  EndpointRelation
  ProcessRelation
}

enum DetectPoint {
  CLIENT
  SERVER
  PROXY
}

type HealthStatus {
  # 0 means healthy, more than 0 means unhealthy
  # and less than 0 means oap doesn't startup.
  score: Int!
  # some details about the score value.
  details: String
}

# The Span for OAP internal debugging.
# All time is in nanoseconds.
type DebuggingSpan {
  spanId: Int!
  parentSpanId: Int!
  operation: String!
  startTime: Long!
  endTime: Long!
  duration: Long!
  msg: String
  error: String
}

# The Trace for OAP internal debugging.
type DebuggingTrace {
  traceId: String!
  condition: String!
  startTime: Long!
  endTime: Long!
  duration: Long!
  spans: [DebuggingSpan!]!
}

# The condition used for instead of serviceId in query.
# If you have service name, you don't need to provide serviceId.
input ServiceCondition {
  serviceName: String!
  # If the service is virtual then required, such the `layer` is `UNDEFINED/VIRTUAL_DATABASE/VIRTUAL_MQ/VIRTUAL_GATEWAY`.
  # Otherwise, it is not required.
  layer: String
}

# The condition used for instead of serviceInstanceId in query.
# If you have service name and instance name, you don't need to provide serviceInstanceId.
input InstanceCondition {
  serviceName: String!
  instanceName: String!
  # If the service is virtual then required, such the `layer` is `UNDEFINED/VIRTUAL_DATABASE/VIRTUAL_MQ/VIRTUAL_GATEWAY`.
  # Otherwise, it is not required.
  layer: String
}

# The condition used for instead of endpointId in query.
# If you have service name and endpoint name, you don't need to provide endpointId.
input EndpointCondition {
  serviceName: String!
  endpointName: String!
  # If the service is virtual then required, such the `layer` is `UNDEFINED/VIRTUAL_DATABASE/VIRTUAL_MQ/VIRTUAL_GATEWAY`.
  # Otherwise, it is not required.
  layer: String
}

extend type Query {
  # Query Health Checker module for the status of OAP server
  checkHealth: HealthStatus!
}

# The list of traces
type TraceBrief {
  traces: [BasicTrace!]!
  #For OAP internal query debugging
  debuggingTrace: DebuggingTrace
}

# Trace basic info
type BasicTrace {
  segmentId: String!
  endpointNames: [String!]!
  duration: Int!
  start: String!
  isError: Boolean
  traceIds: [String!]!
}

# Represent the conditions used for query TraceBrief
input TraceQueryCondition {
  # The value of 0 means all services.
  serviceId: ID
  serviceInstanceId: ID
  traceId: String
  endpointId: ID
  # The time range of traces started
  queryDuration: Duration
  # The min time of trace
  minTraceDuration: Int
  # The max time of trace
  maxTraceDuration: Int
  traceState: TraceState!
  queryOrder: QueryOrder!
  # Map to the tags included in the traces
  tags: [SpanTag!]
  paging: Pagination!
}

# Use service, instance and endpoint name as the condition
input TraceQueryConditionByName {
  # The value of 0 means all services.
  service: ServiceCondition
  instance: InstanceCondition
  endpoint: EndpointCondition
  traceId: String
  # The time range of traces started
  queryDuration: Duration
  # The min time of trace
  minTraceDuration: Int
  # The max time of trace
  maxTraceDuration: Int
  traceState: TraceState!
  queryOrder: QueryOrder!
  # Map to the tags included in the traces
  tags: [SpanTag!]
  paging: Pagination!
}

input SpanTag {
  key: String!
  value: String
}

enum TraceState {
  ALL
  SUCCESS
  ERROR
}

enum QueryOrder {
  BY_START_TIME
  BY_DURATION
}

# The trace represents a distributed trace, includes all segments and spans.
type Trace {
  spans: [Span!]!
  #For OAP internal query debugging
  debuggingTrace: DebuggingTrace
}

type Span {
  traceId: ID!
  segmentId: ID!
  spanId: Int!
  parentSpanId: Int!
  refs: [Ref!]!
  serviceCode: String!
  serviceInstanceName: ID!
  # The start timestamp of the span in millisecond
  startTime: Long!
  # The end timestamp of the span in millisecond
  endTime: Long!
  endpointName: String
  # There are three span types: Local, Entry and Exit
  type: String!
  # Peer network id, e.g. host+port, ip+port
  peer: String
  # The name of the tech stack component used for the execution represented by the span.
  component: String
  # The error status is true when the execution returns error code or throws an exception(determined by the language).
  isError: Boolean
  # There are 5 layers: Unknown, Database, RPCFramework, Http, MQ and Cache
  layer: String
  # key-value(string) pairs to specify unique attributes of ths span
  tags: [KeyValue!]!
  # The events happen of the span, especially in-process.
  logs: [LogEntity!]!
  # The attached events happen in the span's context but out-of-process.
  # Check SpanAttachedEvent definition for more details.
  attachedEvents: [SpanAttachedEvent!]!
}

# Ref represents the link between the segment and its parents.
# The parent(ref) may not exists, which means batch process.
# The UI should display a list, representing the other trace IDs.
type Ref {
  traceId: ID!
  parentSegmentId: ID!
  parentSpanId: Int!
  # Ref type represents why did the ref happen.
  # Include: 1) CrossProcess 2) CrossThread
  type: RefType!
}

enum RefType {
  CROSS_PROCESS
  CROSS_THREAD
}

type LogEntity {
  # The timestamp of the log in millisecond
  time: Long!
  data: [KeyValue!]
}

# An instantaneous point on the time-line.
# An instant represents a data point accurate to the nanosecond.
# It is constituted by a long representing epoch-seconds and an int representing nanosecond-of-second,
# which will always be between 0 and 999,999,999
type Instant {
  # The number of seconds from the epoch of 1970-01-01T00:00:00Z.
  seconds: Long!
  # The number of nanoseconds, later along the time-line, from the seconds field.
  # This is always positive, and never exceeds 999,999,999.
  nanos: Int!
}

# SpanAttachedEvent represents an attached event for a traced RPC.
# When an RPC is being traced by the in-process language agent, a span would be reported by the client-side agent.
# And the rover would be aware of this RPC due to the existing tracing header.
# Then, the rover agent collects extra information from the OS level to provide assistance information to diagnose network performance.
#
# Notice, THIS IS ALSO AVAILABLE FOR ZIPKIN SPAN.
# -----------------------------------------------
# In SkyWalking, ZipkinQueryHandler provides full support for all Zipkin span queries.
# SpanAttachedEvent query is supported through the trace query URI: /api/v2/trace/{traceId}
# A new `attachedEvents` field would be added in JSONArray format with SpanAttachedEvent in JSON as elements.
type SpanAttachedEvent {
  # The nanosecond timestamp of the event's start time.
  # Notice, most unit of timestamp in SkyWalking is milliseconds, but NANO-SECOND is required here.
  # Because the attached event happens in the OS syscall level, most of them are executed rapidly.
  startTime: Instant!
  # The official event name.
  # For example, the event name is a method signature from syscall stack.
  event: String!
  # [Optional] The nanosecond timestamp of the event's end time.
  endTime: Instant!
  # The tags for this event includes some extra OS level information,
  # such as
  # 1. net_device used for this exit span.
  # 2. network L7 protocol
  tags: [KeyValue]!
  # The summary of statistics during this event.
  # Each statistic provides a name(metric name) to represent the name, and an int64/long as the value.
  summary: [KeyNumericValue!]!
}

# Param, if debug is true will enable the query tracing and return DebuggingTrace in the result.
extend type Query {
  # Search segment list with given conditions
  queryBasicTraces(condition: TraceQueryCondition, debug: Boolean): TraceBrief
  queryBasicTracesByName(condition: TraceQueryConditionByName, debug: Boolean): TraceBrief
  # Read the specific trace ID with given trace ID
  # duration is optional, and only for BanyanDB. If not provided, means search in the last 1 day.
  queryTrace(traceId: ID!, duration: Duration, debug: Boolean): Trace
  # Read the list of searchable keys
  queryTraceTagAutocompleteKeys(duration: Duration!): [String!]
  # Search the available value options of the given key.
  queryTraceTagAutocompleteValues(tagKey: String!, duration: Duration!): [String!]
}

type TraceList {
  traces: [TraceV2!]!
  # The time range of the traces actually retrieved.
  # If the queryDuration is not given, the time range is the timestamp(ms) from now - 1day to now.
  retrievedTimeRange: RetrievedTimeRange!
  # For OAP internal query debugging
  debuggingTrace: DebuggingTrace
}

type TraceV2 {
  spans: [Span!]!
}

type RetrievedTimeRange {
  # The start time (ms) of the traces actually retrieved.
  startTime: Long!
  # The end time (ms) of the traces actually retrieved.
  endTime: Long!
}

# Param, if debug is true will enable the query tracing and return DebuggingTrace in the result.
extend type Query {
  queryTraces(condition: TraceQueryCondition, debug: Boolean): TraceList
  # Feature detection endpoint: returns true if the backend supports the Query Traces V2 API.
  # Returns false if the backend does not support Query Traces V2.
  # This field is intended to assist clients in migrating to the new API.
  hasQueryTracesV2Support: Boolean!
}
